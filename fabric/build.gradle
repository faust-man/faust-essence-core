plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    exclusiveContent {
        forRepository { maven { url = providers.gradleProperty('coreModMenuRepository').getOrElse('https://maven.terraformersmc.com/releases/') } }
        filter { includeGroup 'com.terraformersmc' }
    }
}
dependencies {
    modCompileOnly 'com.terraformersmc:modmenu:11.0.3'
    modLocalRuntime 'com.terraformersmc:modmenu:11.0.3'
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

if(project.hasProperty('withStamina')) {
    evaluationDependsOn(':stamina-fabric')
    dependencies { runtimeOnly project(':stamina-fabric').sourceSets.main.output }
    loom.mods { fauststamina { sourceSet project(':stamina-fabric').sourceSets.main } }
}

dependencies { modImplementation files(new File(rootProject.file(providers.gradleProperty('apiProjectDir').getOrElse('../faust-essence-api')), 'fabric/build/libs/essence-api-fabric-1.21.1-1.0.0.jar')) }
