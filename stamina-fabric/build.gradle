plugins { id 'java-library'; id 'fabric-loom' }
version = rootProject.version
group = 'com.faust.stamina'
base.archivesName = 'fauststamina-fabric-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    maven { url='https://maven.parchmentmc.org/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly(project(':common')) { capabilities { requireCapability 'com.faust.core:faustcore' } }
}
def staminaProjectDir = rootProject.file(providers.gradleProperty('staminaProjectDir').getOrElse('../faust-essence-stamina'))
if (!new File(staminaProjectDir, 'src/main/java').isDirectory()) {
    throw new GradleException('Clone faust-essence-stamina next to core or set -PstaminaProjectDir=<path>; see README.md')
}
sourceSets.main.java { setSrcDirs([new File(staminaProjectDir, 'src/main/java')]); exclude '**/StaminaMod.java' }
sourceSets.main.resources { setSrcDirs([new File(staminaProjectDir, 'src/main/resources')]); exclude 'META-INF/neoforge.mods.toml' }
jar { from(rootProject.file('LICENSE')) }

processResources { filesMatching('fabric.mod.json') { expand(version: project.version) } }

loom { mixin { defaultRefmapName.set('fauststamina.refmap.json') } }

sourceSets.main.compileClasspath += project(':fabric').sourceSets.main.compileClasspath
