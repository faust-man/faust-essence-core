plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly files(layout.buildDirectory.file("moddev/artifacts/vanilla-${neo_form_version}-minecraft-resources-aka-client-extra.jar"))
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

tasks.register('modelTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.faust.core.progression.ProgressTest'
}
tasks.named('test') { dependsOn modelTest }

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

dependencies { testImplementation project(':stamina') }

['withStaminaTest':true,'withoutStaminaTest':false].each { taskName, enabled ->
    tasks.register(taskName,JavaExec) {
        dependsOn testClasses
        classpath = enabled ? sourceSets.test.runtimeClasspath : sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('essence-stamina-') }
        mainClass='com.faust.core.progression.StaminaBoundaryTest'
        args enabled.toString(), layout.buildDirectory.dir("stamina-boundary").get().asFile.absolutePath
    }
    tasks.named('test') { dependsOn taskName }
}

tasks.named('withStaminaTest') { dependsOn 'withoutStaminaTest' }

dependencies { compileOnly files(new File(rootProject.file(providers.gradleProperty('apiProjectDir').getOrElse('../faust-essence-api')), 'neoforge/build/libs/essence-api-neoforge-1.21.1-1.0.0.jar')); testImplementation files(new File(rootProject.file(providers.gradleProperty('apiProjectDir').getOrElse('../faust-essence-api')), 'neoforge/build/libs/essence-api-neoforge-1.21.1-1.0.0.jar')) }
