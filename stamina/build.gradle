plugins { id 'java-library' }
version = rootProject.version
group = 'com.faust.stamina'
base.archivesName = 'essence-stamina-neoforge-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
dependencies { compileOnly(project(':common')) { capabilities { requireCapability 'com.faust.core:faustcore' } } }
// Only the NeoForge entrypoint annotation is needed; the model has no loader dependencies.
sourceSets.main.compileClasspath += project(':neoforge').sourceSets.main.compileClasspath
processResources { filesMatching(['fabric.mod.json','META-INF/neoforge.mods.toml']) { expand(version: project.version) } }


sourceSets.main.compileClasspath += project(':common').sourceSets.main.compileClasspath

def staminaProjectDir = rootProject.file(providers.gradleProperty('staminaProjectDir').getOrElse('../faust-essence-stamina'))
if (!new File(staminaProjectDir, 'src/main/java').isDirectory()) {
    throw new GradleException('Clone faust-essence-stamina next to core or set -PstaminaProjectDir=<path>; see README.md')
}
sourceSets.main.java.setSrcDirs([new File(staminaProjectDir, 'src/main/java')])
sourceSets.main.resources.setSrcDirs([new File(staminaProjectDir, 'src/main/resources')])
sourceSets.main.resources.exclude 'fabric.mod.json'
jar { from(rootProject.file('LICENSE')) }

sourceSets.main.java.exclude '**/StaminaModMenu.java'
